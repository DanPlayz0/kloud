x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-kloud}:${POSTGRES_PASSWORD:-kloud_local}@postgres:5432/${POSTGRES_DB:-kloud}}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
  DNS_ENCRYPTION_KEY: ${DNS_ENCRYPTION_KEY:-}
  PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    labels:
      kloud.internal: 'true'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kloud_local}
      POSTGRES_DB: ${POSTGRES_DB:-kloud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    labels:
      kloud.internal: 'true'
    environment: *api-environment
    command: [node, apps/api/dist/migrate.js]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  connector:
    profiles: [connector]
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    init: true
    labels:
      kloud.internal: 'true'
    environment:
      API_URL: http://api:3000
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:-}
      CONNECTOR_HOST: ${CONNECTOR_HOST:-docker-host}
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_ENABLED: ${DOCKER_ENABLED:-true}
      PM2_ENABLED: ${PM2_ENABLED:-false}
      DEPLOYMENTS_ENABLED: ${DEPLOYMENTS_ENABLED:-false}
      RUNTIME_ENABLED: ${RUNTIME_ENABLED:-false}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_NGINX_IMAGE: ${PROXY_NGINX_IMAGE:-nginx:stable-alpine}
      PROXY_CERTBOT_IMAGE: ${PROXY_CERTBOT_IMAGE:-certbot/certbot:latest}
      DEPLOYMENTS_DIR: /var/lib/kloud/deployments
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket-owning group must be supplied for the non-root connector.
    group_add:
      - ${DOCKER_GID:-0}
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    labels:
      kloud.internal: 'true'
    environment:
      <<: *api-environment
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    labels:
      kloud.internal: 'true'
    environment:
      API_UPSTREAM: api:3000
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
